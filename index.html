
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-ULTRA AI</title>
  <link rel="stylesheet" href="style.css?v=8">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="logo">K<span>✦</span></div>
      <div class="brand">
        <h2>K-ULTRA AI</h2>
        <p><span class="online"></span> AI is online</p>
      </div>
      <button type="button" id="sidebarToggle" class="sidebar-toggle">☰</button>
    </header>

    <div class="workspace">

      <aside class="sidebar">
        <button type="button" class="new-chat" id="newChatBtn">
          ＋ New Chat
        </button>

        <input
          type="search"
          id="chatSearch"
          class="chat-search"
          placeholder="Search chats..."
        >

        <div id="chatSessions"></div>
      </aside>

      <main class="main">

        <div class="welcome">
          <div class="orb">✦</div>
          <h1>Beyond Intelligence.</h1>
          <h2>Welcome to K-ULTRA AI</h2>
          <p>Your ideas. Your world. Your AI.</p>
          <p class="telugu">నమస్కారం! నేను మీ K-ULTRA AI.</p>
        </div>

        <div class="suggestions">
          <button type="button" onclick="sendSuggestion('Explain something interesting')">
            ✧ Explore ideas
          </button>
          <button type="button" onclick="sendSuggestion('Teach me something new')">
            ✧ Learn something
          </button>
          <button type="button" onclick="sendSuggestion('Write a creative story')">
            ✧ Create a story
          </button>
        </div>

        <div id="chat"></div>

      </main>
    </div>

    <footer class="composer">

      <button type="button" id="attachBtn" title="Attach file">
        📎
      </button>

      <input
        type="file"
        id="fileInput"
        accept=".txt,.md,.pdf,.doc,.docx,.png,.jpg,.jpeg"
        hidden
      >

      <input
        type="text"
        id="userInput"
        placeholder="Message K-ULTRA AI..."
        autocomplete="off"
      >

      <button type="button" id="micBtn">🎤</button>

      <button id="imageBtn" type="button">🎨 Generate Image</button>

      <button type="button" id="sendBtn">➤</button>

      <button
        type="button"
        id="stopBtn"
        class="stop-button"
        style="display:none;"
      >
        ⏹ Stop
      </button>

    </footer>

    <div id="filePreview" class="file-preview"></div>

    <p class="footer-note">POWERED BY K-ULTRA AI ✦</p>

  </div>
</body>
</html>
