<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d25">
  <title>K-ULTRA AI</title>
  <link rel="stylesheet" href="style.css?v=20">
  <script src="script.js?v=23" defer></script>
</head>
<body>

  <div class="app" id="app">

    <header class="header">
      <button id="sidebarToggle" type="button" aria-label="Toggle sidebar">☰</button>

      <div class="logo">K</div>
      <div class="brand">K-ULTRA AI</div>

      <div class="header-spacer"></div>

      <button id="themeToggle" class="theme-toggle"
        type="button" aria-label="Change theme">☀️</button>
    </header>

    <div class="workspace">

      <aside class="sidebar" id="sidebar">
        <button id="newChatBtn" type="button">＋ New Chat</button>

        <input
          id="chatSearch"
          type="search"
          placeholder="Search chats..."
          autocomplete="off"
        >

        <h3>Recent Chats</h3>
        <div id="chatSessions"></div>
      </aside>

      <main class="main">

        <section id="welcome">
          <h1>K-ULTRA AI</h1>
          <p>Your intelligent AI assistant</p>
        </section>

        <div id="chat" aria-live="polite"></div>

        <div id="suggestions">
          <button type="button" data-prompt="Hello K-ULTRA AI!">👋 Say Hello</button>
          <button type="button" data-prompt="Tell me about artificial intelligence">🤖 About AI</button>
          <button type="button" data-prompt="Explain this in Telugu">తెలుగులో వివరించు</button>
        </div>

        <form class="composer" id="chatForm">

          <div id="filePreview" hidden></div>

          <input
            id="fileInput"
            type="file"
            accept=".txt,.md,.png,.jpg,.jpeg"
            hidden
          >

          <textarea
            id="userInput"
            placeholder="Message K-ULTRA AI..."
            rows="1"
          ></textarea>

          <div class="composer-actions">
            <button id="attachBtn" type="button" aria-label="Attach file">📎</button>
            <button id="micBtn" type="button" aria-label="Voice input">🎤</button>
            <button id="stopBtn" type="button" hidden>■ Stop</button>
            <button id="sendBtn" type="submit">➤ Send</button>
          </div>

        </form>

        <p class="footer-note">K-ULTRA AI can make mistakes. Verify important information.</p>

      </main>
    </div>
  </div>

</body>
</html>
