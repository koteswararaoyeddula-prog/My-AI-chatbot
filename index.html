<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d25">
  <meta name="description" content="K-ULTRA AI - Your intelligent AI assistant">
  <title>K-ULTRA AI</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/mammoth@1.9.0/mammoth.browser.min.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">K</div>
        <div>
          <h2>K-ULTRA AI</h2>
          <small>Intelligence platform</small>
        </div>
      </div>

      <button class="new-chat" id="newChatBtn">＋ New chat</button>

      <input id="chatSearch" class="search" placeholder="Search chats...">
      <div class="history-title">YOUR CHATS</div>
      <div id="chatSessions" class="chat-sessions"></div>

      <div class="sidebar-bottom">
        <button id="themeToggle" class="side-button">☀️ Change theme</button>
        <div class="version">K-ULTRA AI · Version 1.0</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="sidebarToggle" class="icon-button" aria-label="Toggle sidebar">☰</button>
        <div class="top-brand">
          <span class="mini-logo">K</span>
          <strong>K-ULTRA AI</strong>
          <span class="online-dot"></span>
        </div>
        <button id="headerNewChat" class="icon-button" title="New chat">＋</button>
      </header>

      <section class="chat-area" id="chatArea">
        <div id="welcome" class="welcome">
          <div class="welcome-logo">K</div>
          <p class="eyebrow">YOUR AI WORKSPACE</p>
          <h1>Welcome to <span>K-ULTRA AI</span></h1>
          <p class="welcome-subtitle">Ask, create, learn and build something amazing.</p>

          <div id="suggestions" class="suggestions">
            <button data-prompt="Explain artificial intelligence in simple Telugu and English.">
              <b>✦ Learn something</b><small>Explain a topic clearly</small>
            </button>
            <button data-prompt="Write a professional Python program with explanation.">
              <b>⌘ Build with code</b><small>Generate and explain code</small>
            </button>
            <button data-prompt="Give me a professional project plan for a modern AI application.">
              <b>◈ Plan a project</b><small>Turn an idea into a plan</small>
            </button>
            <button data-prompt="Give me 5 creative ideas for a new technology project.">
              <b>✧ Explore ideas</b><small>Discover new possibilities</small>
            </button>
          </div>
        </div>

        <div id="chat" class="messages"></div>
      </section>

      <section class="composer-wrap">
        <div id="filePreview" class="file-preview" hidden></div>

        <div class="mode-row">
          <label for="modeSelect">MODE</label>
          <select id="modeSelect">
            <option value="chat">AI Chat</option>
            <option value="code">Code Assistant</option>
            <option value="agent">AI Agent Planner</option>
            <option value="document">Document Assistant</option>
            <option value="image">Image Generation</option>
          </select>
          <span class="privacy-note">Do not share passwords or private keys</span>
        </div>

        <form id="chatForm" class="composer">
          <input type="file" id="fileInput" hidden
            accept=".txt,.md,.csv,.json,.html,.css,.js,.py,.java,.c,.cpp,.pdf,.docx">

          <button type="button" id="attachBtn" class="composer-icon" title="Attach file">＋</button>
          <textarea id="userInput" rows="1" maxlength="20000"
            placeholder="Message K-ULTRA AI..."></textarea>
          <button type="button" id="micBtn" class="composer-icon" title="Voice input">🎤</button>
          <button type="submit" id="sendBtn" class="send-button" title="Send">➤</button>
          <button type="button" id="stopBtn" class="stop-button" hidden>Stop</button>
        </form>
        <p class="disclaimer">K-ULTRA AI can make mistakes. Verify important information.</p>
      </section>
    </main>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
